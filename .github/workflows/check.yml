name: Private alpha checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          BUZZ_CONTEXT_TEST_KEYRING: ${{ matrix.os != 'ubuntu-latest' && '1' || '0' }}
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run
  linux-secure-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
      - run: sudo apt-get update
      - run: sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0
      - run: npm ci --ignore-scripts
      - run: dbus-run-session -- bash .github/scripts/linux-keyring-check.sh
        env:
          BUZZ_CONTEXT_TEST_KEYRING: '1'
